<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — NoobCraftBloxTT</title>
<style>
body{margin:0;font-family:Arial;background:#111827;color:white}
header{background:#7c3aed;padding:24px;text-align:center}
main{max-width:650px;margin:25px auto;padding:0 16px}
.card{background:#1f2937;padding:20px;border-radius:16px;margin-bottom:18px}
input,button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;font-size:16px}
input{background:#374151;color:white}button{background:#8b5cf6;color:white;font-weight:bold}
.danger{background:#dc2626}.hidden{display:none}.admin{background:#374151;padding:12px;border-radius:10px;margin-top:8px}
a{color:#c4b5fd}
</style>
</head>
<body>
<header><h1>👑 NoobCraftBloxTT</h1><p>Panneau d'administration</p></header>
<main>
<section id="login" class="card">
<h2>🔐 Connexion Admin</h2>
<input id="password" type="password" placeholder="Code admin">
<button onclick="login()">Se connecter</button>
<p id="error"></p>
</section>

<section id="panel" class="hidden">
<div class="card">
<h2>⚙️ Administration</h2>
<p>✅ Connecté en tant qu'administrateur</p>
<button onclick="location.href='./'">🏠 Retour au site</button>
<button class="danger" onclick="logout()">🚪 Déconnexion</button>
</div>

<div class="card">
<h2>👑 Donner le rôle Admin</h2><p>Entre l’adresse e-mail de la personne.</p>
<input id="newAdmin" type="email" placeholder="Adresse e-mail de l'admin">
<button onclick="addAdmin()">➕ Ajouter Admin</button>
<div id="admins"></div>
<p>⚠️ Cette version est une interface locale : elle ne donne pas réellement de droits à Roblox, GitHub ou TikTok.</p>
</div>
</section>
</main>

<script>
const ADMIN_CODE="lovemaman";
let admins=JSON.parse(localStorage.getItem("ncb_admins")||"[]");

function login(){
 if(document.getElementById("password").value===ADMIN_CODE){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  render();
 }else document.getElementById("error").textContent="❌ Code incorrect.";
}
function logout(){
 document.getElementById("panel").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
}
function addAdmin(){
 const x=document.getElementById("newAdmin").value.trim();
 if(x&&!admins.includes(x))admins.push(x);
 localStorage.setItem("ncb_admins",JSON.stringify(admins));
 document.getElementById("newAdmin").value="";
 render();
}
function removeAdmin(i){
 admins.splice(i,1);
 localStorage.setItem("ncb_admins",JSON.stringify(admins));
 render();
}
function render(){
 document.getElementById("admins").innerHTML=admins.length
 ?admins.map((x,i)=>'<div class="admin">👑 '+x+'<button class="danger" onclick="removeAdmin('+i+')">Supprimer</button></div>').join("")
 :'<div class="admin">Aucun admin ajouté.</div>';
}
</script>
</body>
</html>
